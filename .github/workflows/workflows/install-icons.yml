
name: Install Clash IQ Icons

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack icon files
        run: |
          mkdir -p native-android/app/src/main/res
          unzip -o clash-iq-assets.zip \
            -d native-android/app/src/main/res

      - name: Build APK
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-iq-debug-apk
          path: native-android/app/build/outputs/apk/debug/*.apk
