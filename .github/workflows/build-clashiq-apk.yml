name: Build Clash IQ Android APK (Testing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Testing branch
        uses: actions/checkout@v4
        with:
          ref: dev-v3.1
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile --allow-build=esbuild --allow-build=@replit/connectors-sdk

      - name: Build latest Testing web app
        run: pnpm --filter @workspace/mecka-clash-dashboard run build

      - name: Prepare Capacitor web bundle
        shell: bash
        run: |
          rm -rf android-app/www
          mkdir -p android-app/www
          cp -a artifacts/mecka-clash-dashboard/dist/. android-app/www/

      - name: Install Capacitor Android shell
        working-directory: android-app
        run: |
          pnpm install --no-frozen-lockfile
          npx cap add android

      - name: Apply Clash IQ launcher icon
        working-directory: android-app
        shell: bash
        run: |
          rm -rf android/app/src/main/res/mipmap-* 
          mkdir -p android/app/src/main/res
          cp -a resources/res/. android/app/src/main/res/

          # Capacitor's generated manifest uses ic_launcher/ic_launcher_round.
          # Keep the explicit Clash IQ resources and fail if the adaptive icon is missing.
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Re-apply launcher icon after Capacitor sync
        working-directory: android-app
        shell: bash
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          cp -a resources/res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: android-app/android
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Clash IQ APK
        uses: actions/upload-artifact@v4
        with:
          name: Clash-IQ-Testing-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
