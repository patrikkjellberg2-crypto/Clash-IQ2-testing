name: Build Clash IQ APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Hosted Clash IQ URL"
        default: "https://clash-iq2-testing.onrender.com"
        required: true
      version_name:
        description: "Version name"
        default: "1.2.1"
        required: true
  push:
    branches:
      - "dev-v3.1"
    tags:
      - "apk-v*"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android-app
    env:
      SERVER_URL: ${{ inputs.server_url || 'https://clash-iq2-testing.onrender.com' }}
      VERSION_NAME: ${{ inputs.version_name || '1.2.2' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify web app typecheck and build
        working-directory: .
        run: |
          corepack enable
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm run typecheck
          corepack pnpm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Patch Google reauth retry for Capacitor 7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('node_modules/@capgo/capacitor-social-login/android/src/main/java/ee/forgr/capacitor/social/login/GoogleProvider.java')
          s = p.read_text()
          if 'REAUTH_RETRY_FLAG' not in s:
              s = s.replace(
                  '    private static final String LOG_TAG = "GoogleProvider";\n',
                  '    private static final String LOG_TAG = "GoogleProvider";\n'
                  '    private static final String REAUTH_RETRY_FLAG = "_googleReauthRetry";\n',
                  1,
              )
              old = '''    private void handleSignInError(GetCredentialException e, PluginCall call, JSONObject config) {\n        Log.e(LOG_TAG, "Google Sign-In failed", e);\n        boolean isBottomUi = false;\n'''
              new = '''    private boolean isAccountReauthFailed(String message) {\n        return message != null && message.contains("Account reauth failed");\n    }\n\n    private boolean isReauthRetry(PluginCall call) {\n        return call.getData().optBoolean(REAUTH_RETRY_FLAG, false);\n    }\n\n    private void markReauthRetry(PluginCall call) {\n        call.getData().put(REAUTH_RETRY_FLAG, true);\n    }\n\n    private void clearCredentialManagerState(CredentialManagerCallback<Void, Exception> handler) {\n        ClearCredentialStateRequest request = new ClearCredentialStateRequest();\n        Executor executor = Executors.newSingleThreadExecutor();\n        credentialManager.clearCredentialStateAsync(\n            request, null, executor,\n            new CredentialManagerCallback<Void, ClearCredentialException>() {\n                @Override public void onResult(Void result) { handler.onResult(null); }\n                @Override public void onError(@NonNull ClearCredentialException e) { handler.onError(e); }\n            }\n        );\n    }\n\n    private void retryLoginAfterReauthFailure(PluginCall call, JSONObject config, JSONObject options) {\n        try {\n            options.put("style", "standard");\n            options.put("filterByAuthorizedAccounts", false);\n            call.getData().put("options", options);\n        } catch (JSONException ex) {\n            call.reject("Google Sign-In failed: " + ex.getMessage());\n            return;\n        }\n        login(call, config);\n    }\n\n    private void handleAccountReauthFailed(PluginCall call, JSONObject config, JSONObject options) {\n        String errorMessage = "Account reauth failed";\n        if (isReauthRetry(call)) {\n            call.reject("Google Sign-In failed: [16] Account reauth failed after retry. Credential Manager state was cleared and the standard account picker was retried.");\n            return;\n        }\n        Log.w(LOG_TAG, "Account reauth failed; clearing Credential Manager state and retrying with standard sign-in.");\n        markReauthRetry(call);\n        clearCredentialManagerState(\n            new CredentialManagerCallback<Void, Exception>() {\n                @Override public void onResult(Void unused) { retryLoginAfterReauthFailure(call, config, options); }\n                @Override public void onError(@NonNull Exception clearError) {\n                    Log.w(LOG_TAG, "Could not clear Credential Manager state; retrying sign-in anyway.", clearError);\n                    retryLoginAfterReauthFailure(call, config, options);\n                }\n            }\n        );\n    }\n\n    private void handleSignInError(GetCredentialException e, PluginCall call, JSONObject config) {\n        Log.e(LOG_TAG, "Google Sign-In failed", e);\n        boolean isBottomUi = false;\n'''
              if old not in s:
                  raise SystemExit('Expected GoogleProvider handleSignInError block not found')
              s = s.replace(old, new, 1)
              old2 = '''        if (e instanceof NoCredentialException) {\n'''
              new2 = '''        if (isAccountReauthFailed(e.getMessage())) {\n            handleAccountReauthFailed(call, config, options);\n            return;\n        }\n        if (e instanceof NoCredentialException) {\n'''
              if old2 not in s:
                  raise SystemExit('Expected NoCredentialException block not found')
              s = s.replace(old2, new2, 1)
              p.write_text(s)
              print('Applied Google error 16 retry patch.')
          else:
              print('Google error 16 retry patch already present.')
          PY

      - name: Point the app at the hosted dashboard
        run: |
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("capacitor.config.json","utf8")); c.server.url=process.env.SERVER_URL; c.appendUserAgent="ClashIQ/"+process.env.VERSION_NAME; fs.writeFileSync("capacitor.config.json",JSON.stringify(c,null,2));'

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Install native Clash IQ Android overrides
        run: |
          mkdir -p android/app/src/main/java/com/clashiq/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/values

          cp native-overrides/MainActivity.java android/app/src/main/java/com/clashiq/app/MainActivity.java
          cp native-overrides/widget/ClashIQWidgetProvider.java android/app/src/main/java/com/clashiq/app/ClashIQWidgetProvider.java
          cp native-overrides/widget/ClashIQWidgetUpdater.java android/app/src/main/java/com/clashiq/app/ClashIQWidgetUpdater.java
          cp native-overrides/widget/widget_clash_iq.xml android/app/src/main/res/layout/widget_clash_iq.xml
          cp native-overrides/widget/widget_bg.xml android/app/src/main/res/drawable/widget_bg.xml
          cp native-overrides/widget/widget_info.xml android/app/src/main/res/xml/widget_info.xml
          cp native-overrides/widget/widget_strings.xml android/app/src/main/res/values/widget_strings.xml

          test -f android/app/src/main/java/com/clashiq/app/ClashIQWidgetProvider.java
          test -f android/app/src/main/res/xml/widget_info.xml
          echo "Verified Clash IQ widget provider and widget metadata resources."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'android.permission.INTERNET' not in s:
              application = re.search(r'(?m)^\s*<application\b', s)
              if not application:
                  raise SystemExit('<application> not found')
              s = (s[:application.start()]
                   + '    <uses-permission android:name="android.permission.INTERNET" />\n'
                   + s[application.start():])

          if 'android.permission.POST_NOTIFICATIONS' not in s:
              internet = re.search(
                  r'(?m)^\s*<uses-permission\s+android:name="android\.permission\.INTERNET"\s*/>\s*$', s)
              if not internet:
                  raise SystemExit('INTERNET permission could not be located')
              s = (s[:internet.end()]
                   + '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
                   + s[internet.end():])

          receiver='''        <receiver android:name=".ClashIQWidgetProvider" android:exported="true">
              <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  <action android:name="com.clashiq.app.WIDGET_UPDATE" />
              </intent-filter>
              <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
          </receiver>
          '''
          if 'ClashIQWidgetProvider' not in s:
              if '</application>' not in s:
                  raise SystemExit('</application> not found')
              s = s.replace('</application>', receiver + '    </application>', 1)

          if 'android:scheme="clash' + 'iq"' not in s:
              activity = re.search(r'(?ms)(\s*<activity(?=[^>]*android:name="\.MainActivity")[^>]*>.*?</activity>)', s)
              if not activity:
                  raise SystemExit('MainActivity activity block not found')
              scheme = 'clash' + 'iq'
              deep_link_filter = f'''\n              <intent-filter>\n                  <action android:name="android.intent.action.VIEW" />\n                  <category android:name="android.intent.category.DEFAULT" />\n                  <category android:name="android.intent.category.BROWSABLE" />\n                  <data android:scheme="{scheme}" android:host="open" />\n              </intent-filter>'''
              block = activity.group(1)
              s = s[:activity.start(1)] + block[:-len('</activity>')] + deep_link_filter + '\n        </activity>' + s[activity.end(1):]

          p.write_text(s)
          PY

          test -f android/app/src/main/java/com/clashiq/app/MainActivity.java
          grep -q 'implements ModifiedMainActivityForSocialLoginPlugin' android/app/src/main/java/com/clashiq/app/MainActivity.java
          grep -q 'handleGoogleLoginIntent' android/app/src/main/java/com/clashiq/app/MainActivity.java
          echo "Verified generated MainActivity contains Social Login bridge implementation."

      - name: Install fixed debug keystore
        run: |
          cp debug.keystore android/debug.keystore
          chmod 600 android/debug.keystore
          keytool -list -v -keystore android/debug.keystore -alias androiddebugkey -storepass android | grep -E 'Alias name:|SHA1:|SHA-1:'

      - name: Update Android toolchain for Social Login
        run: |
          sed -i 's/com.android.tools.build:gradle:[0-9.\-]*/com.android.tools.build:gradle:8.9.1/' android/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+/compileSdkVersion = 36/' android/variables.gradle
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' android/variables.gradle
          sed -i 's/targetSdk = [0-9]*/targetSdk = 35/' android/variables.gradle
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.11.1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure fixed debug signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='android {'
          block='''android {
              signingConfigs {
                  debug {
                      storeFile file("${rootProject.projectDir}/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      storeType "JKS"
                  }
              }
          '''
          if 'storeFile file("${rootProject.projectDir}/debug.keystore")' not in s:
              if marker not in s:
                  raise SystemExit('android { block not found')
              s=s.replace(marker, block, 1)
          p.write_text(s)
          PY
          grep -n -A8 'signingConfigs' android/app/build.gradle

      - name: Force AndroidX Browser version for Social Login
        run: |
          cat > android/force-browser.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.force("androidx.browser:browser:1.9.0")
            }
          }
          EOF

      - name: Apply icon resources and version
        run: |
          cp -r resources/res/. android/app/src/main/res/
          export VERSION_CODE=$(( $(date +%s) / 60 ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Apply AppCompat activity theme
        run: |
          cp native-overrides/styles.xml android/app/src/main/res/values/styles.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          pattern = r'(<activity\b(?=[^>]*android:name="\.MainActivity")[^>]*\bandroid:theme=")[^"]+(")'
          updated, count = re.subn(pattern, r'\1@style/AppTheme.NoActionBar\2', s, count=1)
          if count != 1:
              raise SystemExit('Could not set MainActivity theme in AndroidManifest.xml')
          p.write_text(updated)
          PY
          grep -n -A4 -B2 'android:name=".MainActivity"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:theme="@style/AppTheme.NoActionBar"' android/app/src/main/AndroidManifest.xml
          grep -q 'parent="Theme.AppCompat.DayNight.NoActionBar"' android/app/src/main/res/values/styles.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew -I force-browser.gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(find . -path "*build/outputs/apk/debug/*.apk" | head -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Clash-IQ-${{ env.VERSION_NAME }}-debug
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish update manifest version
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          mkdir -p artifacts/mecka-clash-dashboard/public
          cat > artifacts/mecka-clash-dashboard/public/app-version.json <<EOF
          {
            "latestVersion": "${{ env.VERSION_NAME }}",
            "releaseUrl": "https://github.com/patrikkjellberg2-crypto/Clash-IQ2-testing/releases",
            "notes": "Latest Clash IQ Android beta release."
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/mecka-clash-dashboard/public/app-version.json
          if git diff --cached --quiet; then
            echo "Update manifest already current."
          else
            git commit -m "chore: publish Clash IQ version ${{ env.VERSION_NAME }} [skip apk]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
# Trigger current dev-v3.1 APK build with native Google SocialLogin bridge
# Force a clean APK build after launcher icon update
