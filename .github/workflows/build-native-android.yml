
name: Build Clash IQ Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - clash-iq-native-android
    paths:
      - "native-android/**"
      - "clash-iq-assets.zip"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack icon assets
        run: |
          mkdir -p native-android/app/src/main/res
          unzip -o clash-iq-assets.zip \
            -d native-android/app/src/main/res

      - name: Build debug APK
        run: gradle -p native-android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-iq-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
